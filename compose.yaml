services:
  redis:
    image: redis:8.10-alpine
    container_name: raspishika-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - raspishika-network
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-secret}
    restart: unless-stopped

  api:
    image: azzimoda/raspishika-api:latest
    container_name: raspishika-api
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-secret}
      - REDIS_DB=0
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - TZ=Asia/Yekaterinburg
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - raspishika-network
    restart: unless-stopped

  bot:
    image: azzimoda/raspishika-bot:latest
    container_name: raspishika-bot
    shm_size: 2g
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_BOT_TOKEN=${ADMIN_BOT_TOKEN}
      - ADMIN_ID=${ADMIN_ID}
      - SCRAPER_HOST=api
      - SCRAPER_PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - TZ=Asia/Yekaterinburg
      - BROWSER_SCALE=${BROWSER_SCALE:-1}
      - HANDLE_VACATION=${HANDLE_VACATION:-true}
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./storage:/app/storage
    networks:
      - raspishika-network
    restart: unless-stopped

networks:
  raspishika-network:
    driver: bridge

volumes:
  redis-data:
