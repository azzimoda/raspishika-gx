services:
  redis:
    image: redis:8.10-alpine
    container_name: raspishika-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    # command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - raspishika-network
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-secret}

  db:
    image: postgres:16-alpine
    container_name: raspishika-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-raspishika}
      - POSTGRES_DB=raspishika
      - TZ=Asia/Yekaterinburg
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d raspishika"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - raspishika-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    container_name: raspishika-api
    command: ["/app/fakeapi"]
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-secret}
      - REDIS_DB=0
      - LOG_LEVEL=${LOG_LEVEL:-debug}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - raspishika-network
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: bot.Dockerfile
    container_name: raspishika-bot
    command: ["/app/bot"]
    shm_size: 2g
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_BOT_TOKEN=${ADMIN_BOT_TOKEN}
      - ADMIN_ID=${ADMIN_ID:-0}
      - SCRAPER_HOST=api
      - SCRAPER_PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - TZ=Asia/Yekaterinburg
      - BROWSER_SCALE=${BROWSER_SCALE:-1}
      - HANDLE_VACATION=${HANDLE_VACATION:-false}
      - DB_DRIVER=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-raspishika}
      - DB_NAME=raspishika
      - DB_SSLMODE=disable
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    networks:
      - raspishika-network
    restart: unless-stopped

  adminbot:
    build:
      context: .
      dockerfile: bot.Dockerfile
    container_name: raspishika-adminbot
    entrypoint: /app/adminbot
    environment:
      - ADMIN_BOT_TOKEN=${ADMIN_BOT_TOKEN}
      - ADMIN_ID=${ADMIN_ID:-0}
      - SCRAPER_HOST=api
      - SCRAPER_PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - DB_DRIVER=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-raspishika}
      - DB_NAME=raspishika
      - DB_SSLMODE=disable
    depends_on:
      api:
        condition: service_started
      bot:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    networks:
      - raspishika-network
    restart: unless-stopped

networks:
  raspishika-network:
    driver: bridge

volumes:
  redis-data:
  pg-data:
