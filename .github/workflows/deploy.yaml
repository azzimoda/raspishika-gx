name: Deploy

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/deploy.yaml'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'migrations/*'
      - 'templates/*'
      - 'compose.yaml'
      - 'configs/**'
      - 'Makefile'
      - '*.Dockerfile'
      - 'go.*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l internal/ cmd/ pkg/)"
          if [ -n "$unformatted" ]; then
            echo "gofmt: файлы требуют форматирования:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/raspishika-api:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/raspishika-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Bot
        uses: docker/build-push-action@v5
        with:
          context: .
          file: bot.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/raspishika-bot:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/raspishika-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Образы тегируются по SHA, поэтому откат — это правка одной строки
      # IMAGE_TAG в .env на VPS и повторный `docker compose up -d`. Старые образы
      # намеренно не вычищаются: prune делал откат невозможным.
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd ~/raspishika-gx
            git pull
            # Точечно обновляем только IMAGE_TAG, не трогая секреты в .env.
            touch .env
            sed -i '/^IMAGE_TAG=/d' .env
            echo "IMAGE_TAG=${DEPLOY_SHA}" >> .env
            docker compose pull
            docker compose down
            docker compose up -d
            docker compose ps

      - name: Notify success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.ADMIN_ID }}
          token: ${{ secrets.ADMIN_BOT_TOKEN }}
          message: "Deploy successed! SHA: ${{ github.sha }}"

      - name: Notify failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.ADMIN_ID }}
          token: ${{ secrets.ADMIN_BOT_TOKEN }}
          message: "Deploy failed! Job: ${{ github.job }}"
