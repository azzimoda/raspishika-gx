# .github/workflows/deploy.yml
name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push API image
        run: |
          docker build -f api.Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/raspishika-api:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/raspishika-api:latest

      - name: Build and push Bot image
        run: |
          docker build -f bot.Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/raspishika-bot:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/raspishika-bot:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/raspishika-gx
            docker compose pull
            docker compose down
            docker compose up -d
