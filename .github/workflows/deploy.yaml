name: Deploy

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/deploy.yaml'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'migrations/*'
      - 'templates/*'
      - 'compose.yaml'
      - 'go.*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api.Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/raspishika-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Bot
        uses: docker/build-push-action@v5
        with:
          context: .
          file: bot.Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/raspishika-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/raspishika-gx
            git pull
            docker compose pull
            docker compose down
            docker compose up -d

      - name: Notify success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.ADMIN_ID }}
          token: ${{ secrets.ADMIN_BOT_TOKEN }}
          message: "Deploy successed! SHA: ${{ github.sha }}"

      - name: Notify failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.ADMIN_ID }}
          token: ${{ secrets.ADMIN_BOT_TOKEN }}
          message: "Deploy failed! Job: ${{ github.job }}"
